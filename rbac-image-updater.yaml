
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater-secret-reader
  namespace: backend  
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["harbor-registry-secret"]  
  verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater-secret-reader-binding
  namespace: backend  
subjects:
- kind: ServiceAccount
  name: argocd-image-updater  
  namespace: argocd  
roleRef:
  kind: Role
  name: argocd-image-updater-secret-reader
  apiGroup: rbac.authorization.k8s.io
